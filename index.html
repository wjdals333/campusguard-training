<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안내</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .message-box {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-top: 4px solid #d32f2f; /* 경고 느낌을 주는 붉은색 포인트 */
            border-radius: 8px;
            padding: 40px 30px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .warning-text {
            font-size: 1.25rem;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 20px;
            word-break: keep-all;
        }
        .description-text {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #555;
            word-break: keep-all;
        }
        .action-text {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #333;
        }
        .highlight {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #1976d2;
        }
    </style>
</head>
<body>

    <div class="message-box">
        <div class="warning-text">
            [ 검증되지 않은 링크를 클릭하셨습니다. ]
        </div>
        
        <div class="description-text">
            실제 공격에서는 이 링크가 가짜 배송 조회나<br>
            개인정보 입력 화면으로 이어질 수 있습니다.
        </div>
        
        <div class="action-text">
            채팅으로 돌아가 아래 문구를 입력해 주세요.
            <span class="highlight">"링크를 확인했습니다"</span>
        </div>
    </div>

</body>
</html>
